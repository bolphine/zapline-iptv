name: Release

# A release is published whenever main carries a version (versionName in app/build.gradle.kts) that has
# no release yet: bump the version, push, and the signed APK appears under Releases.
# Pushing a v* tag or running the workflow by hand works too.
on:
  push:
    branches: [main]
    paths:
      - app/build.gradle.kts
      - .github/workflows/release.yml
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            ver=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
            tag="v${ver}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.version.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.exists == 'false'

      - name: Restore and check the signing key
        if: steps.version.outputs.exists == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.ZAPLINE_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ZAPLINE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZAPLINE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ZAPLINE_KEY_PASSWORD }}
        run: |
          # Report problems as annotations (never the values themselves).
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing ZAPLINE_KEYSTORE_BASE64"
          [ -z "$STORE_PW" ] && missing="$missing ZAPLINE_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing ZAPLINE_KEY_ALIAS"
          [ -z "$KEY_PW" ] && missing="$missing ZAPLINE_KEY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Missing or empty repository secrets:$missing"; exit 1; fi
          # Tolerate pasted whitespace or line breaks in the base64 value.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::ZAPLINE_KEYSTORE_BASE64 isn't valid base64 (copy the whole long line, nothing else)"; exit 1
          fi
          echo "Keystore: $(wc -c < "$RUNNER_TEMP/release.jks") bytes"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PW" >/dev/null 2>&1; then
            echo "::error::Keystore didn't open: ZAPLINE_KEYSTORE_PASSWORD is wrong or ZAPLINE_KEYSTORE_BASE64 is incomplete"; exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PW" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::No key called '$KEY_ALIAS' in the keystore: ZAPLINE_KEY_ALIAS should be zapline"; exit 1
          fi
          echo "::notice::Signing key OK"

      - name: Tests
        if: steps.version.outputs.exists == 'false'
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build signed APK
        if: steps.version.outputs.exists == 'false'
        env:
          ZAPLINE_KEYSTORE: ${{ runner.temp }}/release.jks
          ZAPLINE_KEYSTORE_PASSWORD: ${{ secrets.ZAPLINE_KEYSTORE_PASSWORD }}
          ZAPLINE_KEY_ALIAS: ${{ secrets.ZAPLINE_KEY_ALIAS }}
          ZAPLINE_KEY_PASSWORD: ${{ secrets.ZAPLINE_KEY_PASSWORD }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ./gradlew assembleRelease --console=plain
          # Refuse to publish an APK signed with the debug key.
          signer=$("$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | grep "certificate DN" | head -1)
          echo "$signer"
          case "$signer" in *"Android Debug"*) echo "Release APK is debug-signed; check the signing secrets" >&2; exit 1;; esac
          cp app/build/outputs/apk/release/app-release.apk "Zapline-${TAG}.apk"

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" "Zapline-${TAG}.apk" --target "$GITHUB_SHA" --title "Zapline $TAG" --generate-notes
