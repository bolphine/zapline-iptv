name: Release

# A release is published whenever main carries a version (versionName in app/build.gradle.kts) that has
# no release yet: bump the version, push, and the signed APK appears under Releases.
# Pushing a v* tag or running the workflow by hand works too.
on:
  push:
    branches: [main]
    paths:
      - app/build.gradle.kts
      - .github/workflows/release.yml
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            ver=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
            tag="v${ver}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.exists == 'false'

      - name: Restore signing key
        if: steps.version.outputs.exists == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.ZAPLINE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "ZAPLINE_KEYSTORE_BASE64 secret is missing" >&2; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Tests
        if: steps.version.outputs.exists == 'false'
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build signed APK
        if: steps.version.outputs.exists == 'false'
        env:
          ZAPLINE_KEYSTORE: ${{ runner.temp }}/release.jks
          ZAPLINE_KEYSTORE_PASSWORD: ${{ secrets.ZAPLINE_KEYSTORE_PASSWORD }}
          ZAPLINE_KEY_ALIAS: ${{ secrets.ZAPLINE_KEY_ALIAS }}
          ZAPLINE_KEY_PASSWORD: ${{ secrets.ZAPLINE_KEY_PASSWORD }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ./gradlew assembleRelease --console=plain
          # Refuse to publish an APK signed with the debug key.
          signer=$("$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | grep "certificate DN" | head -1)
          echo "$signer"
          case "$signer" in *"Android Debug"*) echo "Release APK is debug-signed; check the signing secrets" >&2; exit 1;; esac
          cp app/build/outputs/apk/release/app-release.apk "Zapline-${TAG}.apk"

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" "Zapline-${TAG}.apk" --target "$GITHUB_SHA" --title "Zapline $TAG" --generate-notes
